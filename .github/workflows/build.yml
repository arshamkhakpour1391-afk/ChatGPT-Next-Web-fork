name: build-apk

on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

jobs:
  tests:
    name: تست‌های موتور و رابط کاربری
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui

  apk:
    name: ساخت فایل APK اندروید
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: نصب وابستگی‌ها و بیلد وب
        run: |
          npm ci
          npm run build
          node scripts/make-icons.mjs
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"
      - name: بیلد APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: کپی APK با نام تمیز
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./solo-leveling-system.apk
          ls -la solo-leveling-system.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-system-apk
          path: solo-leveling-system.apk
          retention-days: 30

  screenshots:
    name: اسکرین‌شات از برنامه
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: نصب کرومیوم
        run: npx playwright install --with-deps chromium
      - name: گرفتن اسکرین‌شات‌ها
        run: node ci/screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-screenshots
          path: screenshots/
          retention-days: 30

  db-init:
    name: نصب دیتابیس Supabase + تست یکپارچه‌سازی
    if: ${{ secrets.SL_DB_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: اجرای schema.sql روی Supabase (از طریق Supavisor)
        env:
          PGPASSWORD: ${{ secrets.SL_DB_PASSWORD }}
        run: |
          psql "postgresql://postgres@db.baooyxmxzkzwimitjfjk.supabase.co:6543/postgres?sslmode=require" -v ON_ERROR_STOP=1 -f sql/schema.sql
      - name: تست یکپارچه‌سازی (ثبت‌نام/ورود/ذخیره/چت/لیدربرد)
        run: |
          npm ci
          node ci/test-integration.mjs
        env:
          SUPABASE_URL: https://baooyxmxzkzwimitjfjk.supabase.co
          SUPABASE_KEY: sb_publishable_n8EE3d9MUYK9ah_hdMi9kg_WhMsHKRI
      - name: پاک‌سازی داده‌های تست
        if: always()
        env:
          PGPASSWORD: ${{ secrets.SL_DB_PASSWORD }}
        run: |
          psql "postgresql://postgres@db.baooyxmxzkzwimitjfjk.supabase.co:6543/postgres?sslmode=require" -c "delete from public.duels where p1name like 'slstest_%' or p2name like 'slstest_%'; delete from public.chat_messages where username like 'slstest_%'; delete from public.chat_rooms where name like 'slstest_%'; delete from public.accounts where username like 'slstest_%';"
