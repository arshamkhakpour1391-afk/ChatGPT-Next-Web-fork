name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:deep
  integration:
    runs-on: ubuntu-latest
    needs: test
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:integration
  screenshots:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:screenshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: cp www/index.html android/app/src/main/assets/public/index.html
      - name: Assemble debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
        continue-on-error: true
      - name: Verify APK package if built
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then bash scripts/verify-apk.sh "$APK"; else echo "no apk in this runner"; fi
